# SonarCloud's automatic analysis of this repo.
#
# Left out of the duplication check only (every other check still reads
# them): the tables of words in two languages. Each English and French pair
# has the same shape as the next, so a list of them reads as copies of
# itself, though no two say the same thing. src/realms.ts is the same:
# the realms' pages, each a slug, a name in both languages and its code.
sonar.cpd.exclusions=src/realms.ts,src/lib/server-words.ts,src/realms/court-of-draconia/magic.ts,src/realms/book-of-shadows/french/**,src/realms/book-of-shadows/potion-brewing/pantry-fr.ts
