# Checks db/migrations/ on every change: they apply to an empty database and
# roll back cleanly, and the recipe books' and the hall's queries work
# against what they build. Applying them to production is the deploy's job, not this one's.
name: Database

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - "server/potions*.ts"
      - "server/draconoids*.ts"
      - "server/db.ts"
      - "compose.yaml"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "db/**"
      - "server/potions*.ts"
      - "server/draconoids*.ts"
      - "server/db.ts"
      - "compose.yaml"
      - ".github/workflows/database.yml"
  workflow_dispatch:

# Reads the repository and nothing else.
permissions:
  contents: read

jobs:
  verify:
    name: Migrations build, roll back, and serve the recipe books and the hall
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Apply every migration to an empty database
        run: npm run db:up

      # Down then up again, so every migrate:down is known to work before it is
      # ever needed.
      - name: Roll everything back and apply it again
        run: |
          for _ in db/migrations/*.sql; do docker compose run --rm migrate rollback; done
          docker compose run --rm migrate up

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts

      - name: The recipe books' and the hall's queries against the migrated database
        run: npm test -- server/potions.test.ts server/draconoids.test.ts
        env:
          TEST_DATABASE_URL: postgres://realms@localhost:5436/realms
